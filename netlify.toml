[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.13"
  NODE_VERSION = "22"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/portfolio"
  to = "/portfolio.html"
  status = 301
[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 301
[[redirects]]
  from = "/insights"
  to = "/insights.html"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
