name: Daily News Update

on:
  schedule:
    # 17:00 UTC = 00:00 GMT+7. GitHub may start scheduled jobs a few minutes late.
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dngworks-daily-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install news dependencies
        run: python -m pip install --disable-pip-version-check feedparser requests beautifulsoup4

      - name: Fetch latest news
        run: python scripts/update_news.py

      - name: Commit updated news snapshot
        run: |
          git config user.name "dngworks-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore: update daily news"
            git push
          fi
