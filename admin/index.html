<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nguyen Studio CMS</title><link rel="stylesheet" href="admin.css"></head><body><div class="cms"><aside><h1>Nguyen Studio</h1><p>Static CMS for GitHub Pages</p><button data-file="../content/site-config.json">Cài đặt website</button><button data-file="../content/portfolio-image-map.json">Ảnh Portfolio</button><button data-file="../content/translations.json">Ngôn ngữ</button><a href="../index.html" target="_blank">Mở website ↗</a></aside><main><header><div><h2>Trình chỉnh sửa dữ liệu</h2><p>Chỉnh JSON, xem lỗi ngay và tải đúng file nhỏ để upload lên GitHub.</p></div><span id="current"></span></header><textarea id="editor" spellcheck="false"></textarea><div class="actions"><button id="validate">Kiểm tra JSON</button><button id="format">Định dạng</button><button id="download">Tải file đã sửa</button></div><pre id="status"></pre></main></div><script>
let current='../content/site-config.json';
const editor=document.querySelector('#editor'),status=document.querySelector('#status'),cur=document.querySelector('#current');
async function load(file){current=file;cur.textContent=file.split('/').pop();const r=await fetch(file,{cache:'no-store'});const data=await r.json();editor.value=JSON.stringify(data,null,2);status.textContent='Đã tải dữ liệu.'}
function parse(){return JSON.parse(editor.value)}
document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>load(b.dataset.file));
document.querySelector('#validate').onclick=()=>{try{parse();status.textContent='JSON hợp lệ.'}catch(e){status.textContent='Lỗi JSON: '+e.message}};
document.querySelector('#format').onclick=()=>{try{editor.value=JSON.stringify(parse(),null,2);status.textContent='Đã định dạng.'}catch(e){status.textContent='Lỗi JSON: '+e.message}};
document.querySelector('#download').onclick=()=>{try{const blob=new Blob([JSON.stringify(parse(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=current.split('/').pop();a.click();status.textContent='Đã tải file. Upload đúng file này lên GitHub.'}catch(e){status.textContent='Lỗi JSON: '+e.message}};
load(current);
</script></body></html>
