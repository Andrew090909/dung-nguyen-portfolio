<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nguyen Studio Admin</title><link rel="stylesheet" href="admin.css"></head><body><div class="admin-shell"><aside><h2>Nguyen Studio</h2><p>Static CMS</p><button data-file="../content/site.json">Cài đặt website</button><button data-file="../content/translations.json">Ngôn ngữ</button><button data-file="../content/portfolio-image-map.json">Ảnh Portfolio</button></aside><main><h1>Trình chỉnh sửa dữ liệu</h1><p>Chỉnh JSON, kiểm tra và tải file xuống. Sau đó chỉ upload lại đúng file nhỏ đó lên GitHub.</p><textarea id="editor"></textarea><div><button id="validate">Kiểm tra JSON</button><button id="download">Tải file đã sửa</button></div><p id="status"></p></main></div><script>let current='../content/site.json';const e=document.querySelector('#editor'),s=document.querySelector('#status');async function load(f){current=f;const r=await fetch(f);e.value=JSON.stringify(await r.json(),null,2);s.textContent='Đã tải '+f}document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>load(b.dataset.file));document.querySelector('#validate').onclick=()=>{try{JSON.parse(e.value);s.textContent='JSON hợp lệ'}catch(x){s.textContent='Lỗi: '+x.message}};document.querySelector('#download').onclick=()=>{try{const o=JSON.parse(e.value),b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=current.split('/').pop();a.click();s.textContent='Đã tải file'}catch(x){s.textContent='Lỗi: '+x.message}};load(current);</script></body></html>
