name: News Update Every 6 Hours



on:

  schedule:

    # GitHub Actions cron uses UTC.

    # 05:00, 11:00, 17:00, 23:00 UTC =

    # 12:00, 18:00, 00:00, 06:00 Vietnam time (UTC+7).

    - cron: '0 5,11,17,23 * * *'

  workflow_dispatch:



permissions:

  contents: write



concurrency:

  group: dngworks-news-update

  cancel-in-progress: false



jobs:

  update-news:

    runs-on: ubuntu-latest

    timeout-minutes: 15



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.12'



      - name: Install dependencies

        run: python -m pip install feedparser requests beautifulsoup4



      - name: Validate news script

        run: python -m py_compile scripts/update_news.py



      - name: Fetch latest news

        run: python scripts/update_news.py



      - name: Commit updated news

        run: |

          git config user.name "dngworks-news-bot"

          git config user.email "actions@users.noreply.github.com"

          git add data/news.json

          if git diff --cached --quiet; then

            echo "No news changes."

          else

            git commit -m "chore: update news snapshot"

            git push

          fi
