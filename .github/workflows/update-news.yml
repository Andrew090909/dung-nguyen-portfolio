name: Daily News Update

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install feedparser requests beautifulsoup4

      - name: Fetch latest news
        run: python scripts/update_news.py

      - name: Commit updated news
        run: |
          git config user.name "dngworks-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "chore: update daily news"
            git push
          fi
