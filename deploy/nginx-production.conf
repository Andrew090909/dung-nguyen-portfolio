server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;
    root /var/www/dung-portfolio/current/public;
    index index.php;
    client_max_body_size 8m;

    # Configure your own Let's Encrypt certificate paths.
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    # Enable Brotli after installing the Nginx Brotli dynamic module.
    brotli on;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
